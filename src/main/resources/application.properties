spring.application.name=hibernate-practical

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/librarydb}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Only missing accounts are initialized. Existing passwords are never reset.
app.security.user.username=${APP_USER_USERNAME:user}
app.security.user.password=${APP_USER_PASSWORD:}
app.security.admin.username=${APP_ADMIN_USERNAME:admin}
app.security.admin.password=${APP_ADMIN_PASSWORD:}

# Optional Google Books lookup; local inventory works without this key.
app.books.api-key=${GOOGLE_BOOKS_API_KEY:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
